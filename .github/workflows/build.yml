name: Build GRAB APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g @expo/cli expo-modules-autolinking

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Add internet permission
        run: |
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.INTERNET"/></manifest>|' android/app/src/main/AndroidManifest.xml || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAB-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
