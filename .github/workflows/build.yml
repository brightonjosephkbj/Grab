name: Build GRAB APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Inject pluginManagement into settings.gradle
        run: |
          # Find expo-modules-core android path
          CORE=$(node -e "const p=require.resolve('expo-modules-core/package.json');const path=require('path');console.log(path.dirname(p))")
          echo "expo-modules-core: $CORE"

          # Try gradle-plugin subdir first, fallback to android
          if [ -f "$CORE/android/gradle-plugin/build.gradle" ]; then
            PLUGIN="$CORE/android/gradle-plugin"
          elif [ -f "$CORE/android/build.gradle" ]; then
            PLUGIN="$CORE/android"
          else
            echo "WARNING: Could not find plugin dir"
            PLUGIN="$CORE/android"
          fi
          echo "Using plugin path: $PLUGIN"

          # Prepend pluginManagement block to settings.gradle
          TEMP=$(mktemp)
          cat > $TEMP << BLOCK
pluginManagement {
    includeBuild('$PLUGIN')
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

BLOCK
          cat android/settings.gradle >> $TEMP
          mv $TEMP android/settings.gradle

          echo "=== settings.gradle (first 20 lines) ==="
          head -20 android/settings.gradle

      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAB-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
