name: Build GRAB APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Fix settings.gradle plugin path
        run: |
          PLUGIN=$(find /home/runner/work -path "*/node_modules/@expo/cli/build/gradle-plugin" -type d 2>/dev/null | head -1)
          if [ -z "$PLUGIN" ]; then
            PLUGIN=$(find /home/runner/work -path "*/packages/@expo/cli/build/gradle-plugin" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$PLUGIN" ]; then
            PLUGIN=$(find $(npm root -g) -path "*/@expo/cli/build/gradle-plugin" -type d 2>/dev/null | head -1)
          fi
          echo "Found plugin at: $PLUGIN"
          if [ -n "$PLUGIN" ]; then
            sed -i "s|includeBuild(new File.*)|includeBuild('$PLUGIN')|g" android/settings.gradle
          fi
          echo "--- settings.gradle top ---"
          head -15 android/settings.gradle

      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAB-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
